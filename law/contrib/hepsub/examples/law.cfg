# Law configuration file for HEPSub examples
# Place this file in your project directory or set LAW_CONFIG_FILE environment variable

[DEFAULT]
# Default section for general settings

[core]
# Tell law where to find modules
extend_pythonpath: $PWD

[modules]
# Load contrib modules
law.contrib.hepsub
# Load example tasks
example_workflow

[logging]
# Logging configuration
law: INFO
luigi-interface: INFO

[job]
# HEPSub job configuration

# Directory for job files (if not set, uses temp directory)
hepsub_job_file_dir: $HOME/law_hepsub_jobs
# Alternative: use project-relative path
# hepsub_job_file_dir: ./data/jobs

# Create unique temp directory for each task
hepsub_job_file_dir_mkdtemp: True

# Keep job files after completion for debugging
hepsub_job_file_dir_cleanup: False

# Batch operation chunk sizes (how many jobs to query/cancel at once)
hepsub_chunk_size_cancel: 25
hepsub_chunk_size_query: 25

# Generic job file settings (fallback for all batch systems)
job_file_dir: $HOME/law_jobs
job_file_dir_mkdtemp: True
job_file_dir_cleanup: False

[luigi_core]
# Luigi scheduler configuration
# Use local scheduler (no central scheduler required)
local_scheduler: True

# Number of parallel workers for task execution
parallel_scheduling: False
workers: 1

[HEPSubWorkflow]
# Default settings for HEPSubWorkflow tasks
# These can be overridden per task or via command line

# Default HEPSub group
# hepsub_group: juno

# Default HEPSub pool
# hepsub_pool: local

# Default HEPSub universe
# hepsub_universe: vanilla

[ProcessDataHEPSub]
# Task-specific settings for the ProcessDataHEPSub example

# Default number of files to process
n_files: 10

# Default resource requirements
memory: 2048
walltime: 02:00:00

# HEPSub group for this task
hepsub_group: cms
